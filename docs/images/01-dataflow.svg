<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1500" height="560" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="26" fill="#111827" text-anchor="start" font-weight="700">1 - How a filing becomes an answer</text>
<text x="40" y="76" font-size="15" fill="#6B7280" text-anchor="start" font-weight="400">Left to right. Each box is a repository or an AWS service; every arrow is data actually moving.</text>
<rect x="40" y="190" width="170" height="110" rx="8" fill="#FFFFFF" stroke="#4B5563" stroke-width="2"/>
<text x="125" y="222" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">SEC EDGAR</text>
<text x="125" y="248" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">public filings</text>
<text x="125" y="270" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">5 req/s, no key</text>
<rect x="290" y="190" width="170" height="110" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="375" y="222" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">Ingest - repo 3</text>
<text x="375" y="248" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">ECS Fargate</text>
<text x="375" y="270" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">3 tasks per day</text>
<rect x="540" y="190" width="170" height="110" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="625" y="222" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">Landing</text>
<text x="625" y="248" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">S3 = system of record</text>
<text x="625" y="270" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">Volume = transport</text>
<rect x="790" y="190" width="170" height="110" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="3"/>
<text x="875" y="222" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">Medallion - repo 4</text>
<text x="875" y="248" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">bronze to silver to gold</text>
<text x="875" y="270" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">4 tasks, ~4.5 min</text>
<rect x="1040" y="190" width="170" height="110" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="1125" y="222" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">Serving export</text>
<text x="1125" y="248" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">4 Parquet + manifest</text>
<text x="1125" y="270" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">about 120 KB</text>
<rect x="1290" y="190" width="170" height="110" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
<text x="1375" y="222" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">repo 5 UI / repo 6 chat</text>
<text x="1375" y="248" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">read S3 only</text>
<text x="1375" y="270" font-size="13" fill="#6B7280" text-anchor="middle" font-weight="400">never the warehouse</text>
<line x1="210" y1="245" x2="284" y2="245" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="250.0" y="175" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">HTTPS</text>
<line x1="460" y1="245" x2="534" y2="245" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="500.0" y="175" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">gzip NDJSON</text>
<line x1="710" y1="245" x2="784" y2="245" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="750.0" y="175" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">Auto Loader</text>
<line x1="960" y1="245" x2="1034" y2="245" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="1000.0" y="175" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">Parquet</text>
<line x1="1210" y1="245" x2="1284" y2="245" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<text x="1250.0" y="175" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">S3 GET</text>
<rect x="40" y="350" width="1420" height="70" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
<text x="64" y="378" font-size="14" fill="#15803D" text-anchor="start" font-weight="700">repo 1 - Contracts: one installable package defines every table, column and file name</text>
<text x="64" y="402" font-size="14" fill="#14532D" text-anchor="start" font-weight="400">Repos 3, 4 and 5 depend on a pinned version. None keeps a copy, so none can drift. 13 tables, 43 migrations.</text>
<rect x="40" y="440" width="1420" height="70" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="64" y="468" font-size="14" fill="#1D4ED8" text-anchor="start" font-weight="700">repo 2 - Infrastructure: Terraform owns every bucket, role, schedule and host</text>
<text x="64" y="492" font-size="14" fill="#1E3A5F" text-anchor="start" font-weight="400">Nothing is created by hand. An auto-apply refuses any plan that would destroy or replace a resource.</text>
</svg>
