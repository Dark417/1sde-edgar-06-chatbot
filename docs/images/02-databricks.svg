<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1500" height="620" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="26" fill="#111827" text-anchor="start" font-weight="700">2 - Inside Databricks: the medallion layers</text>
<text x="40" y="76" font-size="15" fill="#6B7280" text-anchor="start" font-weight="400">One job, four tasks, serverless. Bronze and silver never leave Databricks; only gold is exported.</text>
<rect x="40" y="140" width="1420" height="130" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
<text x="64" y="174" font-size="17" fill="#6B7280" text-anchor="start" font-weight="700">BRONZE</text>
<text x="64" y="198" font-size="14" fill="#374151" text-anchor="start" font-weight="400">raw, appended, never edited</text>
<rect x="430" y="162" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="590" y="188" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">filing_index_raw</text>
<text x="590" y="210" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Delta table</text>
<rect x="770" y="162" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="930" y="188" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">company_submissions_raw</text>
<text x="930" y="210" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Delta table</text>
<rect x="1110" y="162" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="1270" y="188" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">company_concept_raw</text>
<text x="1270" y="210" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Delta table</text>
<rect x="40" y="300" width="1420" height="130" rx="8" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2"/>
<text x="64" y="334" font-size="17" fill="#1D4ED8" text-anchor="start" font-weight="700">SILVER</text>
<text x="64" y="358" font-size="14" fill="#374151" text-anchor="start" font-weight="400">cleaned, deduped, versioned</text>
<rect x="430" y="322" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="590" y="348" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">company + quarantine</text>
<text x="590" y="370" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Delta table</text>
<rect x="770" y="322" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="930" y="348" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">filing + quarantine (SCD-2)</text>
<text x="930" y="370" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Delta table</text>
<rect x="1110" y="322" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="1270" y="348" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">financial_fact (assertions)</text>
<text x="1270" y="370" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Delta table</text>
<rect x="40" y="460" width="1420" height="130" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="64" y="494" font-size="17" fill="#B45309" text-anchor="start" font-weight="700">GOLD</text>
<text x="64" y="518" font-size="14" fill="#374151" text-anchor="start" font-weight="400">shaped for questions</text>
<rect x="430" y="482" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="590" y="508" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">financials_current</text>
<text x="590" y="530" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Delta table</text>
<rect x="770" y="482" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="930" y="508" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">restatement_event</text>
<text x="930" y="530" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Delta table</text>
<rect x="1110" y="482" width="320" height="62" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
<text x="1270" y="508" font-size="13" fill="#111827" text-anchor="middle" font-weight="400">filing_activity_daily, company_profile</text>
<text x="1270" y="530" font-size="12" fill="#6B7280" text-anchor="middle" font-weight="400">Delta table</text>
<line x1="750" y1="272" x2="750" y2="296" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<line x1="750" y1="432" x2="750" y2="456" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="40" y="520" width="690" height="76" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
<text x="64" y="548" font-size="14" fill="#15803D" text-anchor="start" font-weight="700">Keys are content-derived</text>
<text x="64" y="574" font-size="13" fill="#14532D" text-anchor="start" font-weight="400">sha2(cik | concept | period_end | unit), never identity columns, so a re-run is idempotent.</text>
<rect x="770" y="520" width="690" height="76" rx="8" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/>
<text x="794" y="548" font-size="14" fill="#B45309" text-anchor="start" font-weight="700">A restatement is a new assertion, not an edit</text>
<text x="794" y="574" font-size="13" fill="#374151" text-anchor="start" font-weight="400">The old value stays, flagged superseded. That is what makes point-in-time queries possible.</text>
</svg>
