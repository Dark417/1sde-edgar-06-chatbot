<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="630" viewBox="0 0 1500 630" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1500" height="630" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#374151"/></marker></defs>
<text x="40" y="46" font-size="26" fill="#111827" text-anchor="start" font-weight="700">5 - What runs on AWS, and what it costs</text>
<text x="40" y="76" font-size="15" fill="#6B7280" text-anchor="start" font-weight="400">Everything is in us-east-2, the region the Databricks metastore lives in. Figures are real, from Cost Explorer.</text>
<text x="40" y="135" font-size="15" fill="#111827" text-anchor="start" font-weight="700">Scheduled ingest</text>
<rect x="40" y="145" width="460" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="270" y="181" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">EventBridge Scheduler</text>
<text x="270" y="205" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">cron 06:00 UTC, one rule</text>
<text x="270" y="235" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">$0.00 per month</text>
<rect x="520" y="145" width="460" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="750" y="181" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">ECS Fargate</text>
<text x="750" y="205" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">0.5 vCPU / 1 GB, 3 tasks a day</text>
<text x="750" y="235" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">$0.07 per month</text>
<rect x="1000" y="145" width="460" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="1230" y="181" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">ECR</text>
<text x="1230" y="205" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">one image, about 200 MB</text>
<text x="1230" y="235" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">$0.02 per month</text>
<text x="40" y="295" font-size="15" fill="#111827" text-anchor="start" font-weight="700">Storage</text>
<rect x="40" y="305" width="460" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="270" y="341" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">S3 raw</text>
<text x="270" y="365" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">system of record, 90-day IA</text>
<text x="270" y="395" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">$0.02 per month</text>
<rect x="520" y="305" width="460" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="750" y="341" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">S3 serving</text>
<text x="750" y="365" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">4 Parquet files and a manifest</text>
<text x="750" y="395" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">$0.01 per month</text>
<rect x="1000" y="305" width="460" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="1230" y="341" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">S3 tfstate</text>
<text x="1230" y="365" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">Terraform state, versioned</text>
<text x="1230" y="395" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">$0.00 per month</text>
<text x="40" y="455" font-size="15" fill="#111827" text-anchor="start" font-weight="700">Supporting</text>
<rect x="40" y="465" width="460" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="270" y="501" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">Secrets Manager</text>
<text x="270" y="525" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">one secret, the SEC User-Agent</text>
<text x="270" y="555" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">$0.40 per month</text>
<rect x="520" y="465" width="460" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="750" y="501" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">CloudWatch Logs</text>
<text x="750" y="525" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">14-day retention</text>
<text x="750" y="555" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">$0.00 per month</text>
<rect x="1000" y="465" width="460" height="112" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="1230" y="501" font-size="15" fill="#111827" text-anchor="middle" font-weight="700">SSM, IAM, VPC</text>
<text x="1230" y="525" font-size="13" fill="#374151" text-anchor="middle" font-weight="400">names and roles, no NAT gateway</text>
<text x="1230" y="555" font-size="15" fill="#15803D" text-anchor="middle" font-weight="700">$0.02 per month</text>
<rect x="40" y="570" width="940" height="46" rx="8" fill="#DCFCE7" stroke="#15803D" stroke-width="2"/>
<text x="64" y="599" font-size="14" fill="#14532D" text-anchor="start" font-weight="400">Pipeline total: about $0.55 a month. No NAT gateway and no load balancer, the two things that usually dominate.</text>
<rect x="1000" y="570" width="460" height="46" rx="8" fill="#FEF3C7" stroke="#B45309" stroke-width="2"/>
<text x="1024" y="599" font-size="14" fill="#B45309" text-anchor="start" font-weight="400">Plus one t4g.micro at about $6.13, hosting repos 5 and 6.</text>
</svg>
