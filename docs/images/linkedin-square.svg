<text x="330" y="1020" font-size="30" fill="#111827" text-anchor="start" font-weight="700">Claude &#183; the AI agent</text>
<text x="330" y="1062" font-size="20" fill="#374151" text-anchor="start" font-weight="400">picks one of 9 fixed SQL tools, never does the math</text>
<text x="330" y="1098" font-size="18" fill="#6B7280" text-anchor="start" font-weight="400">every figure comes from a query, shown with its trace</text>
</svg>
