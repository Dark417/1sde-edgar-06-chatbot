<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1200" height="1200" fill="#FFFFFF"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#4B5563"/>
  </marker>
</defs>

<text x="600" y="86" font-size="44" fill="#111827" text-anchor="middle" font-weight="700">Chat with SEC filings</text>
<text x="600" y="128" font-size="20" fill="#6B7280" text-anchor="middle" font-weight="400">From a public filing to a plain-English answer, once a day</text>

<!-- 1 · SEC EDGAR -->
<rect x="110" y="180" width="980" height="150" rx="12" fill="#F3F4F6" stroke="#4B5563" stroke-width="2.5"/>
<circle cx="200" cy="255" r="50" fill="#FFFFFF" stroke="#4B5563" stroke-width="2.5"/>
<g transform="translate(150,205)" stroke="#374151" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
  <path d="M28 18 h30 l16 16 v48 a5 5 0 0 1 -5 5 h-41 a5 5 0 0 1 -5 -5 v-59 a5 5 0 0 1 5 -5 z" fill="#FFFFFF"/>
  <path d="M58 18 v16 h16" fill="none"/>
  <path d="M36 50 h28 M36 61 h28 M36 72 h18" fill="none"/>
</g>
<text x="300" y="236" font-size="27" fill="#111827" text-anchor="start" font-weight="700">SEC EDGAR</text>
<text x="300" y="270" font-size="19" fill="#374151" text-anchor="start" font-weight="400">every US public company files its results here</text>
<text x="300" y="299" font-size="17" fill="#6B7280" text-anchor="start" font-weight="400">free, no key, no account &#183; 5 requests per second</text>

<line x1="200" y1="334" x2="200" y2="374" stroke="#4B5563" stroke-width="3.5" marker-end="url(#a)"/>

<!-- 2 · AWS -->
<rect x="110" y="378" width="980" height="150" rx="12" fill="#FFF7ED" stroke="#C2410C" stroke-width="2.5"/>
<circle cx="200" cy="453" r="50" fill="#FFFFFF" stroke="#C2410C" stroke-width="2.5"/>
<g transform="translate(150,403)">
  <rect x="24" y="51" width="52" height="16" rx="8" fill="#C2410C"/>
  <circle cx="40" cy="47" r="15" fill="#C2410C"/>
  <circle cx="58" cy="42" r="19" fill="#C2410C"/>
  <circle cx="70" cy="53" r="12" fill="#C2410C"/>
</g>
<text x="300" y="434" font-size="27" fill="#111827" text-anchor="start" font-weight="700">AWS</text>
<text x="300" y="468" font-size="19" fill="#374151" text-anchor="start" font-weight="400">a container pulls the day's filings each morning</text>
<text x="300" y="497" font-size="17" fill="#6B7280" text-anchor="start" font-weight="400">S3 keeps the response exactly as it arrived</text>

<line x1="200" y1="532" x2="200" y2="572" stroke="#4B5563" stroke-width="3.5" marker-end="url(#a)"/>

<!-- 3 · Databricks -->
<rect x="110" y="576" width="980" height="150" rx="12" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
<circle cx="200" cy="651" r="50" fill="#FFFFFF" stroke="#B45309" stroke-width="2.5"/>
<g transform="translate(150,601)">
  <rect x="22" y="23" width="56" height="14" rx="4" fill="#B87333" stroke="#7C2D12" stroke-width="2"/>
  <rect x="22" y="43" width="56" height="14" rx="4" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
  <rect x="22" y="63" width="56" height="14" rx="4" fill="#EAB308" stroke="#A16207" stroke-width="2"/>
</g>
<text x="300" y="632" font-size="27" fill="#111827" text-anchor="start" font-weight="700">Databricks</text>
<text x="300" y="666" font-size="19" fill="#374151" text-anchor="start" font-weight="400">bronze to silver to gold, once per morning</text>
<text x="300" y="695" font-size="17" fill="#6B7280" text-anchor="start" font-weight="400">a restatement is a new row, not an edit to the old one</text>

<line x1="200" y1="730" x2="200" y2="770" stroke="#4B5563" stroke-width="3.5" marker-end="url(#a)"/>

<!-- 4 · AI agent -->
<rect x="110" y="774" width="980" height="150" rx="12" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
<circle cx="200" cy="849" r="50" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.5"/>
<g transform="translate(150,799)">
  <path d="M24 21 h52 a8 8 0 0 1 8 8 v30 a8 8 0 0 1 -8 8 h-28 l-14 13 v-13 h-10 a8 8 0 0 1 -8 -8 v-30 a8 8 0 0 1 8 -8 z" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="3.5" stroke-linejoin="round"/>
  <circle cx="40" cy="44" r="4" fill="#1D4ED8"/>
  <circle cx="53" cy="44" r="4" fill="#1D4ED8"/>
  <circle cx="66" cy="44" r="4" fill="#1D4ED8"/>
</g>
<text x="300" y="830" font-size="27" fill="#111827" text-anchor="start" font-weight="700">AI agent</text>
<text x="300" y="864" font-size="19" fill="#374151" text-anchor="start" font-weight="400">picks one of 9 fixed SQL tools, never does the math</text>
<text x="300" y="893" font-size="17" fill="#6B7280" text-anchor="start" font-weight="400">every figure comes from a query, shown with its trace</text>

<rect x="110" y="962" width="980" height="92" rx="12" fill="#111827"/>
<text x="600" y="1022" font-size="38" fill="#FFFFFF" text-anchor="middle" font-weight="700">edgar.xiaoxiaolei.com</text>

<text x="600" y="1102" font-size="17" fill="#6B7280" text-anchor="middle" font-weight="400">Live demo on Databricks Free Edition &#183; non-commercial &#183; not investment advice</text>
<text x="600" y="1130" font-size="17" fill="#6B7280" text-anchor="middle" font-weight="400">6 repositories, one pinned contracts package so they cannot drift</text>
</svg>
