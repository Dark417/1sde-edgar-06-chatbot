<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1200" height="1200" fill="#FFFFFF"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#4B5563"/>
  </marker>
</defs>

<text x="600" y="94" font-size="46" fill="#111827" text-anchor="middle" font-weight="700">Chat with SEC filings</text>
<text x="600" y="138" font-size="21" fill="#6B7280" text-anchor="middle" font-weight="400">From a public filing to a plain-English answer, once a day</text>

<!-- 1 · SEC EDGAR -->
<rect x="100" y="210" width="1000" height="190" rx="14" fill="#F3F4F6" stroke="#4B5563" stroke-width="2.5"/>
<circle cx="210" cy="305" r="58" fill="#FFFFFF" stroke="#4B5563" stroke-width="2.5"/>
<g transform="translate(160,255)" fill="#1F2937">
  <path d="M50 17 L87 38 H13 Z"/>
  <rect x="17" y="43" width="66" height="7" rx="1"/>
  <rect x="24" y="55" width="9" height="25"/>
  <rect x="38" y="55" width="9" height="25"/>
  <rect x="53" y="55" width="9" height="25"/>
  <rect x="67" y="55" width="9" height="25"/>
  <rect x="13" y="84" width="74" height="8" rx="2"/>
</g>
<text x="330" y="282" font-size="30" fill="#111827" text-anchor="start" font-weight="700">SEC EDGAR</text>
<text x="330" y="324" font-size="20" fill="#374151" text-anchor="start" font-weight="400">every US public company files its results here</text>
<text x="330" y="360" font-size="18" fill="#6B7280" text-anchor="start" font-weight="400">free, no key, no account &#183; 5 requests per second</text>

<line x1="210" y1="404" x2="210" y2="452" stroke="#4B5563" stroke-width="4" marker-end="url(#a)"/>

<!-- 2 · AWS -->
<rect x="100" y="456" width="1000" height="190" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
<circle cx="210" cy="551" r="58" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5"/>
<g transform="translate(157,505)" fill="#FF9900">
  <rect x="24" y="51" width="52" height="16" rx="8"/>
  <circle cx="40" cy="47" r="15"/>
  <circle cx="58" cy="42" r="19"/>
  <circle cx="70" cy="53" r="12"/>
</g>
<text x="330" y="528" font-size="30" fill="#111827" text-anchor="start" font-weight="700">AWS</text>
<text x="330" y="570" font-size="20" fill="#374151" text-anchor="start" font-weight="400">a container pulls the day's filings each morning</text>
<text x="330" y="606" font-size="18" fill="#6B7280" text-anchor="start" font-weight="400">S3 keeps the response exactly as it arrived</text>

<line x1="210" y1="650" x2="210" y2="698" stroke="#4B5563" stroke-width="4" marker-end="url(#a)"/>

<!-- 3 · Databricks -->
<rect x="100" y="702" width="1000" height="190" rx="14" fill="#FEF2F2" stroke="#FF3621" stroke-width="2.5"/>
<circle cx="210" cy="797" r="58" fill="#FFFFFF" stroke="#FF3621" stroke-width="2.5"/>
<g transform="translate(181.2,768.2) scale(2.4)" fill="#FF3621">
  <path d="M.95 14.184L12 20.403l9.919-5.55v2.21L12 22.662l-10.484-5.96-.565.308v.77L12 24l11.05-6.218v-4.317l-.515-.309L12 19.118l-9.867-5.653v-2.21L12 16.805l11.05-6.218V6.32l-.515-.308L12 11.974 2.647 6.681 12 1.388l7.76 4.368.668-.411v-.566L12 0 .95 6.27v.72L12 13.207l9.919-5.55v2.26L12 15.52 1.516 9.56l-.565.308Z"/>
</g>
<text x="330" y="774" font-size="30" fill="#111827" text-anchor="start" font-weight="700">Databricks</text>
<text x="330" y="816" font-size="20" fill="#374151" text-anchor="start" font-weight="400">bronze to silver to gold, once per morning</text>
<text x="330" y="852" font-size="18" fill="#6B7280" text-anchor="start" font-weight="400">a restatement is a new row, not an edit to the old one</text>

<line x1="210" y1="896" x2="210" y2="944" stroke="#4B5563" stroke-width="4" marker-end="url(#a)"/>

<!-- 4 · Claude -->
<rect x="100" y="948" width="1000" height="190" rx="14" fill="#FDF5F2" stroke="#D97757" stroke-width="2.5"/>
<circle cx="210" cy="1043" r="58" fill="#FFFFFF" stroke="#D97757" stroke-width="2.5"/>
