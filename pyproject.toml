[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finchat"
version = "0.1.0"
description = "Chat over the EDGAR lakehouse gold layer: tools compute, the model narrates"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.37",
    "duckdb>=1.0",
    "boto3>=1.34",
    "pydantic>=2.7",
    "pyarrow>=16.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-aws>=0.2",
]

[project.optional-dependencies]
adk = ["google-adk>=1.0", "litellm>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finchat"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["finchat"]
strict = true

[[tool.mypy.overrides]]
# Optional adk extra + framework internals: strict typing of other people's
# untyped APIs is noise, not safety. DEBT: revisit if adk becomes mandatory.
module = ["google.adk.*", "google.genai.*", "litellm.*", "langgraph.*",
          "langchain_core.*", "langchain_aws.*", "duckdb.*", "streamlit.*",
          "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["finchat.agent.lg_runner", "finchat.ui.chat"]
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
# Optional-extra code: strict-checked only in the CI adk job where the real
# types are installed; without them every Base class is Any and 'strict' is
# noise about other people's stubs, not about this code.
module = ["finchat.agent.adk_runner"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "loop: full-turn tests against a scripted fake model",
    "live: one real Bedrock round; costs tokens; run manually",
]
addopts = "-q -m 'not live'"

[tool.coverage.run]
source = ["src/finchat"]
omit = [
    "src/finchat/ui/chat.py",          # streamlit script body; helpers are tested
    "src/finchat/agent/adk_runner.py", # covered by the CI adk job when the extra installs
]
